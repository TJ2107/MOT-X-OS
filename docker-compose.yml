version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    networks:
      - motx-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./motx-frontend
      dockerfile: Dockerfile
    ports:
      - '3000:5173'
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - motx-net

networks:
  motx-net:
    driver: bridge
